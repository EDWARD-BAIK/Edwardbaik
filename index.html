<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDWARD KALKULATOR</title>

<!-- ===== PROTEKSI SOURCE CODE ===== -->
<script>
// Mencegah klik kanan
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert('❌ Akses ditolak! Source code EDWARD dilindungi.');
});

// Mencegah Ctrl+U (View Source)
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        alert('❌ View source tidak diizinkan!');
    }
    // Mencegah Ctrl+Shift+I (DevTools)
    if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I')) {
        e.preventDefault();
        alert('❌ DevTools tidak diizinkan!');
    }
    // Mencegah F12 (DevTools)
    if (e.key === 'F12') {
        e.preventDefault();
        alert('❌ DevTools tidak diizinkan!');
    }
    // Mencegah Ctrl+S (Save Page)
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        alert('❌ Menyimpan halaman tidak diizinkan!');
    }
});

// Deteksi DevTools via console.log
(function detectDevTools() {
    var devtools = /./;
    devtools.toString = function() {
        if (!this._start) {
            this._start = new Date().getTime();
        }
        if (new Date().getTime() - this._start > 100) {
            alert('❌ DevTools terdeteksi! Akses ditolak.');
            document.body.innerHTML = '<h1 style="color:#ff4466;text-align:center;margin-top:50px;">🚫 AKSES DITOLAK</h1><p style="text-align:center;color:rgba(255,255,255,.3);">DevTools tidak diizinkan di EDWARD</p>';
        }
        return '';
    };
    console.log('%c', devtools);
})();

// Override console.log, console.table, dll
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.table = function() {};
console.info = function() {};
console.debug = function() {};

// Blokir akses via iframe (clickjacking)
if (window.top !== window.self) {
    document.body.innerHTML = '<h1 style="color:#ff4466;text-align:center;margin-top:50px;">🚫 AKSES DITOLAK</h1><p style="text-align:center;color:rgba(255,255,255,.3);">Halaman ini tidak bisa di-iframe</p>';
}

// Hapus semua event listener dari document (mencegah manipulasi)
document.addEventListener('DOMContentLoaded', function() {
    // Blokir semua aksi copy
    document.addEventListener('copy', function(e) {
        e.preventDefault();
        alert('❌ Copy tidak diizinkan!');
    });
    document.addEventListener('cut', function(e) {
        e.preventDefault();
        alert('❌ Cut tidak diizinkan!');
    });
    document.addEventListener('paste', function(e) {
        e.preventDefault();
        alert('❌ Paste tidak diizinkan!');
    });
    // Blokir drag
    document.addEventListener('dragstart', function(e) {
        e.preventDefault();
    });
});
</script>

<style>
/* RESET & FONTS */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#e0e0e0;font-family:'Segoe UI','Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;background-image:radial-gradient(circle at 20% 30%,#1a0a1e 0%,#0a0a0a 80%)}

/* SCROLLBAR NEON */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:#141414}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff00c8,#00ffe0);border-radius:10px}

/* MAIN CONTAINER */
.calculator{max-width:400px;width:100%;background:rgba(20,20,20,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:8px solid #ff00c8;border-right:8px solid #ff00c8;border-bottom:8px solid #00ffe0;box-shadow:0 0 60px rgba(255,0,200,.08),inset 0 0 60px rgba(255,0,200,.02),0 20px 60px rgba(0,0,0,.8);padding:30px;position:relative}

/* BRAND */
.brand{text-align:center;margin-bottom:25px;border-bottom:4px solid rgba(255,0,200,.2);padding-bottom:15px}
.brand h1{font-size:28px;font-weight:900;color:#ff00c8;letter-spacing:4px;text-shadow:0 0 80px rgba(255,0,200,.15);font-family:'Inter',sans-serif;text-transform:uppercase}
.brand .sub{font-size:10px;color:rgba(255,255,255,.1);letter-spacing:6px;text-transform:uppercase;margin-top:4px}

/* DISPLAY */
.display{background:#0a0a12;padding:20px;border:3px solid rgba(255,255,255,.05);margin-bottom:20px;position:relative;min-height:80px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden}
.display .expression{color:rgba(255,255,255,.15);font-size:16px;font-family:'Courier New',monospace;word-break:break-all;width:100%;text-align:right;min-height:24px}
.display .result{color:#00ffe0;font-size:42px;font-weight:700;font-family:'Courier New',monospace;word-break:break-all;width:100%;text-align:right;text-shadow:0 0 40px rgba(0,255,224,.1);transition:.15s}
.display .memory-indicator{position:absolute;top:10px;left:15px;color:rgba(255,0,200,.2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px}

/* BUTTON GRID */
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* BUTTON STYLE - BRUTALISM */
.btn{background:rgba(255,255,255,.02);border:3px solid rgba(255,255,255,.04);padding:18px 10px;font-size:22px;font-weight:700;color:rgba(255,255,255,.7);cursor:pointer;transition:.15s;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.5px;position:relative;user-select:none}
.btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);transform:scale(1.02)}
.btn:active{transform:scale(.95)}

/* OPERATOR */
.btn.operator{color:#ff00c8;border-color:rgba(255,0,200,.1);background:rgba(255,0,200,.02)}
.btn.operator:hover{border-color:#ff00c8;background:rgba(255,0,200,.08);box-shadow:0 0 30px rgba(255,0,200,.05)}

/* EQUALS */
.btn.equals{background:#ff00c8;border-color:#ff00c8;color:#fff;font-size:28px;box-shadow:0 0 40px rgba(255,0,200,.1)}
.btn.equals:hover{background:#cc00a0;border-color:#cc00a0;box-shadow:0 0 60px rgba(255,0,200,.2);transform:scale(1.02)}

/* CLEAR & DELETE */
.btn.clear{color:#ff4466;border-color:rgba(255,68,102,.1);background:rgba(255,68,102,.02)}
.btn.clear:hover{border-color:#ff4466;background:rgba(255,68,102,.08)}
.btn.delete{color:#ff8800;border-color:rgba(255,136,0,.1);background:rgba(255,136,0,.02)}
.btn.delete:hover{border-color:#ff8800;background:rgba(255,136,0,.08)}

/* MEMORY */
.btn.memory{color:#00ffe0;border-color:rgba(0,255,224,.1);background:rgba(0,255,224,.02);font-size:14px}
.btn.memory:hover{border-color:#00ffe0;background:rgba(0,255,224,.08)}

/* ZERO SPAN */
.btn.zero{grid-column:span 2}

/* PERCENT & DOT */
.btn.percent{color:rgba(255,255,255,.3)}

/* RESPONSIVE */
@media(max-width:450px){
    .calculator{padding:20px}
    .btn{padding:15px 8px;font-size:18px}
    .display .result{font-size:32px}
    .brand h1{font-size:22px}
}

@media(max-width:350px){
    .calculator{padding:15px}
    .btn{padding:12px 6px;font-size:15px;gap:8px}
    .display .result{font-size:26px}
    .buttons{gap:8px}
}
</style>
</head>
<body>

<div class="calculator">
    <!-- BRAND -->
    <div class="brand">
        <h1>EDWARD</h1>
        <div class="sub">KALKULATOR</div>
    </div>

    <!-- DISPLAY -->
    <div class="display">
        <div class="memory-indicator" id="memoryIndicator">M: 0</div>
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <!-- BUTTONS -->
    <div class="buttons">
        <!-- Baris 1: Memory & Clear -->
        <button class="btn memory" onclick="memoryRecall()">MR</button>
        <button class="btn memory" onclick="memoryClear()">MC</button>
        <button class="btn clear" onclick="clearAll()">AC</button>
        <button class="btn delete" onclick="deleteLast()">⌫</button>

        <!-- Baris 2: 7 8 9 ÷ -->
        <button class="btn" onclick="appendNumber('7')">7</button>
        <button class="btn" onclick="appendNumber('8')">8</button>
        <button class="btn" onclick="appendNumber('9')">9</button>
        <button class="btn operator" onclick="appendOperator('÷')">÷</button>

        <!-- Baris 3: 4 5 6 × -->
        <button class="btn" onclick="appendNumber('4')">4</button>
        <button class="btn" onclick="appendNumber('5')">5</button>
        <button class="btn" onclick="appendNumber('6')">6</button>
        <button class="btn operator" onclick="appendOperator('×')">×</button>

        <!-- Baris 4: 1 2 3 - -->
        <button class="btn" onclick="appendNumber('1')">1</button>
        <button class="btn" onclick="appendNumber('2')">2</button>
        <button class="btn" onclick="appendNumber('3')">3</button>
        <button class="btn operator" onclick="appendOperator('-')">-</button>

        <!-- Baris 5: 0 00 . + -->
        <button class="btn zero" onclick="appendNumber('0')">0</button>
        <button class="btn" onclick="appendNumber('00')">00</button>
        <button class="btn" onclick="appendDecimal()">.</button>
        <button class="btn operator" onclick="appendOperator('+')">+</button>

        <!-- Baris 6: % = -->
        <button class="btn percent" onclick="appendPercent()">%</button>
        <button class="btn equals" onclick="calculate()" style="grid-column:span 3;">=</button>
    </div>
</div>

<script>
// ============================================
// EDWARD KALKULATOR - BRUTALISM NEON
// ============================================

let currentInput = '0';
let previousInput = '';
let operator = null;
let shouldResetDisplay = false;
let memory = 0;
let hasMemory = false;

const resultDisplay = document.getElementById('result');
const expressionDisplay = document.getElementById('expression');
const memoryIndicator = document.getElementById('memoryIndicator');

function updateDisplay() {
    let display = currentInput;
    if (display.length > 14) {
        display = parseFloat(display).toExponential(6);
    }
    resultDisplay.textContent = display;
    updateMemoryIndicator();
}

function updateMemoryIndicator() {
    if (hasMemory) {
        memoryIndicator.textContent = `M: ${memory}`;
        memoryIndicator.style.color = 'rgba(0,255,224,.5)';
    } else {
        memoryIndicator.textContent = 'M: 0';
        memoryIndicator.style.color = 'rgba(255,255,255,.1)';
    }
}

function appendNumber(num) {
    if (shouldResetDisplay) {
        currentInput = '0';
        shouldResetDisplay = false;
    }
    if (currentInput === '0' && num !== '00') {
        currentInput = num;
    } else if (currentInput === '0' && num === '00') {
        // tetap 0
    } else {
        if (currentInput.replace('-','').replace('.','').length >= 14) return;
        currentInput += num;
    }
    updateDisplay();
}

function appendDecimal() {
    if (shouldResetDisplay) {
        currentInput = '0';
        shouldResetDisplay = false;
    }
    if (!currentInput.includes('.')) {
        currentInput += '.';
    }
    updateDisplay();
}

function appendOperator(op) {
    if (operator && !shouldResetDisplay) {
        calculate();
    }
    previousInput = currentInput;
    operator = op;
    shouldResetDisplay = true;
    expressionDisplay.textContent = `${previousInput} ${operator}`;
}

function calculate() {
    if (!operator || shouldResetDisplay) {
        if (currentInput.includes('+') || currentInput.includes('-') || 
            currentInput.includes('×') || currentInput.includes('÷')) {
            try {
                let expr = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                let result = Function('"use strict"; return (' + expr + ')')();
                if (isFinite(result)) {
                    currentInput = String(parseFloat(result.toFixed(10)));
                    updateDisplay();
                }
            } catch(e) {
                // ignore
            }
        }
        return;
    }
    
    const prev = parseFloat(previousInput);
    const curr = parseFloat(currentInput);
    
    if (isNaN(prev) || isNaN(curr)) return;
    
    let result;
    switch(operator) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '×': result = prev * curr; break;
        case '÷': 
            if (curr === 0) {
                currentInput = 'Error';
                updateDisplay();
                operator = null;
                previousInput = '';
                expressionDisplay.textContent = '';
                return;
            }
            result = prev / curr; 
            break;
        default: return;
    }
    
    result = parseFloat(result.toFixed(10));
    currentInput = String(result);
    expressionDisplay.textContent = `${previousInput} ${operator} ${currentInput} =`;
    operator = null;
    previousInput = '';
    shouldResetDisplay = true;
    updateDisplay();
}

function clearAll() {
    currentInput = '0';
    previousInput = '';
    operator = null;
    shouldResetDisplay = false;
    expressionDisplay.textContent = '';
    updateDisplay();
}

function deleteLast() {
    if (shouldResetDisplay) return;
    if (currentInput.length <= 1) {
        currentInput = '0';
    } else {
        currentInput = currentInput.slice(0, -1);
    }
    updateDisplay();
}

function appendPercent() {
    const num = parseFloat(currentInput);
    if (isNaN(num)) return;
    currentInput = String(num / 100);
    updateDisplay();
}

// MEMORY FUNCTIONS
function memoryRecall() {
    if (!hasMemory) return;
    currentInput = String(memory);
    shouldResetDisplay = true;
    updateDisplay();
}

function memoryClear() {
    memory = 0;
    hasMemory = false;
    updateMemoryIndicator();
}

// Keyboard support
document.addEventListener('keydown', (e) => {
    const key = e.key;
    if (key >= '0' && key <= '9') {
        e.preventDefault();
        appendNumber(key);
    } else if (key === '.') {
        e.preventDefault();
        appendDecimal();
    } else if (key === '+') {
        e.preventDefault();
        appendOperator('+');
    } else if (key === '-') {
        e.preventDefault();
        appendOperator('-');
    } else if (key === '*') {
        e.preventDefault();
        appendOperator('×');
    } else if (key === '/') {
        e.preventDefault();
        appendOperator('÷');
    } else if (key === 'Enter' || key === '=') {
        e.preventDefault();
        calculate();
    } else if (key === 'Escape' || key === 'c' || key === 'C') {
        e.preventDefault();
        clearAll();
    } else if (key === 'Backspace') {
        e.preventDefault();
        deleteLast();
    } else if (key === '%') {
        e.preventDefault();
        appendPercent();
    }
});

// Inisialisasi
updateDisplay();
console.log('🧮 EDWARD KALKULATOR · Brutalisme Neon');
console.log('💡 Support keyboard: 0-9, + - * /, Enter, Backspace, Escape');
</script>
</body>
</html>
