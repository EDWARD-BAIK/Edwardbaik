<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --border-color: #222a38;
            --accent-red: #ff3b5c;
            --accent-green: #00e676;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

      
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        
        .category-bar {
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 2rem;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .category-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .category-btn:hover, .category-btn.active {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
        }

      
        main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

       
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #334155;
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #0f172a;
        }

        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 0.6rem;
        }

        .card-source {
            color: var(--accent-red);
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-title {
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            text-decoration: none;
            margin-bottom: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-title:hover {
            color: var(--accent-red);
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            line-height: 1.5;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .card-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 0.8rem;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

       
        .state-container {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-sub);
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
           
            <div class="status-badge">
                <div class="dot"></div>
                <span>CONNECTED</span>
            </div>
        </div>
        <div id="sync-time" style="font-size: 0.8rem; color: var(--text-sub);">Memuat data...</div>
    </header>

    
    <nav class="category-bar">
        <button class="category-btn active" onclick="filterCategory('top', this)">Top News</button>
        <button class="category-btn" onclick="filterCategory('technology', this)">Teknologi</button>
        <button class="category-btn" onclick="filterCategory('business', this)">Bisnis</button>
        <button class="category-btn" onclick="filterCategory('sports', this)">Olahraga</button>
        <button class="category-btn" onclick="filterCategory('entertainment', this)">Hiburan</button>
    </nav>

    <main>
        <div class="news-grid" id="news-container">
            <div class="state-container">Mengambil data berita terbaru....</div>
        </div>
    </main>

    <footer>
        @Edward
    </footer>

    <script>
      
        const API_KEY = 'pub_beae432af9b04f2ea77803f34d6634e2';
        const BASE_URL = 'https://newsdata.io/api/1/latest';
        
        let currentCategory = 'top';

        async function fetchNews(category = 'top') {
            const container = document.getElementById('news-container');
            const syncTime = document.getElementById('sync-time');

          
            const url = `${BASE_URL}?apikey=${API_KEY}&language=id&category=${category}`;

            try {
                syncTime.textContent = 'Memperbarui...';
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 'success' && data.results && data.results.length > 0) {
                    renderArticles(data.results);
                    syncTime.textContent = `Terakhir Sync: ${new Date().toLocaleTimeString('id-ID')} WIB`;
                } else if (data.results && data.results.length === 0) {
                    container.innerHTML = `<div class="state-container">Tidak ada berita ditemukan untuk kategori ini.</div>`;
                    syncTime.textContent = 'Sync selesai (0 Data)';
                } else {
                    throw new Error(data.results?.message || 'Gagal memuat berita dari server.');
                }
            } catch (error) {
                console.error('API Error:', error);
                container.innerHTML = `
                    <div class="state-container">
                        <p style="color: var(--accent-red); font-weight: bold; margin-bottom: 0.5rem;">Gagal Memuat Berita Real-Time!</p>
                        <p style="font-size: 0.85rem;">${error.message}</p>
                    </div>`;
                syncTime.textContent = 'Koneksi API Gagal';
            }
        }

        function renderArticles(articles) {
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            articles.forEach(article => {
             
                const dateObj = new Date(article.pubDate);
                const formattedDate = isNaN(dateObj) 
                    ? article.pubDate 
                    : dateObj.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });

                
                const imageUrl = article.image_url ? article.image_url : 'https://via.placeholder.com/600x350/151a23/94a3b8?text=NewsData+Image';

                const card = document.createElement('article');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${imageUrl}" class="card-img" alt="Thumbnail Berita" onerror="this.src='https://via.placeholder.com/600x350/151a23/94a3b8?text=No+Image';">
                    <div class="card-body">
                        <div class="card-meta">
                            <span class="card-source">${article.source_id || 'REDAKSI'}</span>
                            <span>${formattedDate}</span>
                        </div>
                        <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="card-title">${article.title}</a>
                        <p class="card-desc">${article.description ? article.description : 'Klik judul di atas untuk membaca berita selengkapnya langsung dari penerbit asli.'}</p>
                        <div class="card-footer">
                            Penulis: <strong>${article.creator ? article.creator[0] : 'Redaksi Media'}</strong>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(category, buttonElement) {
          
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');

            currentCategory = category;
            fetchNews(category);
        }

       
        fetchNews(currentCategory);
    </script>
</body>
</html>
