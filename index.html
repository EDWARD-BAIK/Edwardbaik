<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAKTU NYATA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #sky {
      position: relative;
      width: 100%;
      height: 100%;
      transition: background 1.5s ease;
      background: #020111;
    }

    
    .star {
      position: absolute;
      background-color: #fff;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 1.5s ease;
      animation: twinkle var(--duration) infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

  
    #celestial-body {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      top: 0;
      left: 0;
      margin-top: -38px;
      margin-left: -38px;
      transition: background 0.5s ease, box-shadow 0.5s ease;
      z-index: 2;
    }

    
    #weather-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

   
    #info-card {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 22px;
      border-radius: 16px;
      color: #fff;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      min-width: 200px;
    }

    #time-display {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      line-height: 1;
    }

    #phase-tag {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #weather-status {
      font-size: 0.85rem;
      margin-top: 8px;
      opacity: 0.85;
    }

   
    #game-btn {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      z-index: 25;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    #game-btn:active {
      transform: translateX(-50%) scale(0.95);
      background: rgba(255, 255, 255, 0.35);
    }

    
    #game-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .game-header {
      width: 300px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .game-title {
      font-weight: 800;
      font-size: 1.2rem;
    }

    .close-btn {
      background: #ff4757;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #game-canvas {
      background: #111827;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .game-controls {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
    }

    .dpad-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 1.3rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .dpad-btn:active {
      background: rgba(255, 255, 255, 0.4);
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }
  </style>
</head>
<body>

  <div id="sky">
    <div id="stars-container"></div>
    <div id="celestial-body"></div>
    <canvas id="weather-canvas"></canvas>

    <div id="info-card">
      <div id="time-display">00:00:00</div>
      <div id="phase-tag">MEMUAT...</div>
      <div id="weather-status">Mencari lokasi cuaca...</div>
    </div>

    
    <button id="game-btn" onclick="openGame()">MAINKAN GAME</button>
  </div>

  
  <div id="game-modal">
    <div class="game-header">
      <div>
        <div class="game-title">GAME ULAR</div>
        <div style="font-size: 0.85rem; opacity: 0.8;">Skor: <span id="score-val">0</span></div>
      </div>
      <button class="close-btn" onclick="closeGame()">Tutup (X)</button>
    </div>

    <canvas id="game-canvas" width="300" height="300"></canvas>

   
    <div class="game-controls">
      <div class="dpad-btn d-up" onclick="setDir('UP')">▲</div>
      <div class="dpad-btn d-left" onclick="setDir('LEFT')">◀</div>
      <div class="dpad-btn d-down" onclick="setDir('DOWN')">▼</div>
      <div class="dpad-btn d-right" onclick="setDir('RIGHT')">▶</div>
    </div>
  </div>

  <script>
 
    const starsContainer = document.getElementById('stars-container');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2 + 1;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 60}%`;
      star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
      starsContainer.appendChild(star);
    }

    
    function updateSky() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();

      const totalMinutes = h * 60 + m;
      
      document.getElementById('time-display').innerText = 
        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      const sky = document.getElementById('sky');
      const body = document.getElementById('celestial-body');
      const stars = document.querySelectorAll('.star');
      const phaseTag = document.getElementById('phase-tag');

      let phaseText = "";
      let isDay = false;
      let angle = 0;

      if (totalMinutes >= 270 && totalMinutes < 360) { 
        phaseText = "🌅 Subuh / Fajar";
        isDay = false;
        angle = ((totalMinutes - 270) / 90) * (Math.PI * 0.15);
        sky.style.background = 'linear-gradient(to bottom, #0f172a, #581c87, #c2410c, #f97316)';
        setBodyStyle(body, '#ff5722', '0 0 35px #ff5722, 0 0 70px #f97316');

      } else if (totalMinutes >= 360 && totalMinutes < 660) { 
        phaseText = "🌤️ Pagi";
        isDay = true;
        angle = (Math.PI * 0.15) + ((totalMinutes - 360) / 300) * (Math.PI * 0.35);
        sky.style.background = 'linear-gradient(to bottom, #1e3a8a, #3b82f6, #93c5fd)';
        setBodyStyle(body, '#fff176', '0 0 50px #ffeb3b, 0 0 90px #fbc02d');

      } else if (totalMinutes >= 660 && totalMinutes < 900) { 
        phaseText = "☀️ Siang";
        isDay = true;
        angle = (Math.PI * 0.5) + ((totalMinutes - 660) / 240) * (Math.PI * 0.2);
        sky.style.background = 'linear-gradient(to bottom, #0284c7, #38bdf8, #bae6fd)';
        setBodyStyle(body, '#ffffff', '0 0 60px #ffffff, 0 0 100px #81d4fa');

      } else if (totalMinutes >= 900 && totalMinutes < 1050) { 
        phaseText = "🌤️ Sore";
        isDay = true;
        angle = (Math.PI * 0.7) + ((totalMinutes - 900) / 150) * (Math.PI * 0.18);
        sky.style.background = 'linear-gradient(to bottom, #1e293b, #0369a1, #f59e0b)';
        setBodyStyle(body, '#ff9800', '0 0 45px #ff9800, 0 0 80px #f57c00');

      } else if (totalMinutes >= 1050 && totalMinutes < 1110) { 
        phaseText = "🌆 Senja / Terbenam";
        isDay = true;
        angle = (Math.PI * 0.88) + ((totalMinutes - 1050) / 60) * (Math.PI * 0.12);
        sky.style.background = 'linear-gradient(to bottom, #090d16, #1e1b4b, #831843, #ea580c)';
        setBodyStyle(body, '#ff3d00', '0 0 40px #ff3d00, 0 0 80px #dd2c00, 0 0 120px #ff6e40');

      } else { 
        phaseText = "🌙 Malam";
        isDay = false;
        let nightMinutes = totalMinutes >= 1110 ? totalMinutes - 1110 : totalMinutes + 330;
        angle = (nightMinutes / 600) * Math.PI;
        sky.style.background = 'linear-gradient(to bottom, #020111 0%, #050b14 60%, #101728 100%)';
        setBodyStyle(body, '#f1f5f9', '0 0 25px rgba(241, 245, 249, 0.9), 0 0 50px rgba(148, 163, 184, 0.4)');
      }

      phaseTag.innerText = phaseText;

      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;

      const xPos = (0.15 + (Math.cos(Math.PI - angle) + 1) / 2 * 0.70) * screenWidth;
      const yPos = (0.78 - Math.sin(angle) * 0.62) * screenHeight;

      body.style.transform = `translate(${xPos}px, ${yPos}px)`;

      stars.forEach(st => {
        st.style.opacity = !isDay ? Math.random() : '0';
      });
    }

    function setBodyStyle(el, color, shadow) {
      el.style.backgroundColor = color;
      el.style.boxShadow = shadow;
    }

    setInterval(updateSky, 1000);
    updateSky();

 
    const canvas = document.getElementById('weather-canvas');
    const ctx = canvas.getContext('2d');
    let isRaining = false;
    let raindrops = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createRain() {
      raindrops = [];
      const dropCount = Math.floor(window.innerWidth / 3);
      for (let i = 0; i < dropCount; i++) {
        raindrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 20 + 10,
          speed: Math.random() * 12 + 15
        });
      }
    }

    function renderRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (isRaining) {
        ctx.strokeStyle = 'rgba(174, 194, 224, 0.6)';
        ctx.lineWidth = 1.5;
        for (let drop of raindrops) {
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - drop.length * 0.15, drop.y + drop.length);
          ctx.stroke();

          drop.y += drop.speed;
          drop.x -= drop.speed * 0.15;

          if (drop.y > canvas.height) {
            drop.y = -drop.length;
            drop.x = Math.random() * canvas.width;
          }
        }
      }
      requestAnimationFrame(renderRain);
    }
    renderRain();

  
    async function getWeather(lat, lon) {
      const statusEl = document.getElementById('weather-status');
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await res.json();
        const code = data.current_weather.weathercode;

        const rainCodes = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82];
        if (rainCodes.includes(code)) {
          isRaining = true;
          createRain();
          statusEl.innerText = "Cuaca: Hujan 🌧️";
        } else {
          isRaining = false;
          statusEl.innerText = "Cuaca: Cerah / Berawan 🌤️";
        }
      } catch (err) {
        statusEl.innerText = "Cuaca: Menggunakan data estimasi";
      }
    }

    function initWeather() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => getWeather(pos.coords.latitude, pos.coords.longitude),
          () => getWeather(-6.2088, 106.8456),
          { timeout: 5000 }
        );
      } else {
        getWeather(-6.2088, 106.8456);
      }
    }

    initWeather();
    setInterval(initWeather, 600000);

    
    const gCanvas = document.getElementById('game-canvas');
    const gCtx = gCanvas.getContext('2d');
    const grid = 15;
    let count = 0;
    let score = 0;
    let gameInterval;

    let snake = {
      x: 150,
      y: 150,
      dx: grid,
      dy: 0,
      cells: [],
      maxCells: 4
    };

    let apple = { x: 60, y: 60 };

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    function resetGame() {
      snake.x = 150;
      snake.y = 150;
      snake.cells = [];
      snake.maxCells = 4;
      snake.dx = grid;
      snake.dy = 0;
      score = 0;
      document.getElementById('score-val').innerText = score;
      apple.x = getRandomInt(0, 20) * grid;
      apple.y = getRandomInt(0, 20) * grid;
    }

    function gameLoop() {
      gameInterval = requestAnimationFrame(gameLoop);

      if (++count < 6) return;
      count = 0;

      gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);

      snake.x += snake.dx;
      snake.y += snake.dy;

     
      if (snake.x < 0) snake.x = gCanvas.width - grid;
      else if (snake.x >= gCanvas.width) snake.x = 0;
      
      if (snake.y < 0) snake.y = gCanvas.height - grid;
      else if (snake.y >= gCanvas.height) snake.y = 0;

      snake.cells.unshift({ x: snake.x, y: snake.y });

      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }

      
      gCtx.fillStyle = '#ef4444';
      gCtx.fillRect(apple.x, apple.y, grid - 1, grid - 1);

      
      gCtx.fillStyle = '#10b981';
      snake.cells.forEach((cell, index) => {
        gCtx.fillRect(cell.x, cell.y, grid - 1, grid - 1);

        
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          score += 10;
          document.getElementById('score-val').innerText = score;
          apple.x = getRandomInt(0, 20) * grid;
          apple.y = getRandomInt(0, 20) * grid;
        }

      
        for (let i = index + 1; i < snake.cells.length; i++) {
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            resetGame();
          }
        }
      });
    }

    function setDir(dir) {
      if (dir === 'LEFT' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
      else if (dir === 'UP' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
      else if (dir === 'RIGHT' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
      else if (dir === 'DOWN' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
    }

    function openGame() {
      document.getElementById('game-modal').style.display = 'flex';
      resetGame();
      requestAnimationFrame(gameLoop);
    }

    function closeGame() {
      document.getElementById('game-modal').style.display = 'none';
      cancelAnimationFrame(gameInterval);
    }
  </script>
</body>
</html>
